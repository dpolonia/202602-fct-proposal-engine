# --- Core Idea ---
title: "Feasibility and Utility of a Portuguese Synthetic Health Data Portal: An Exploratory Pilot"
title_pt: "Viabilidade e Utilidade de um Portal de Dados de Saúde Sintéticos Português: Um Piloto Exploratório"
acronym: "PDSPP-Pilot"
typology: "PEX"

# --- Research Framing ---
research_topic: |
  Secondary use of health data for research, innovation, and system planning is
  severely constrained in Portugal by GDPR requirements, fragmented governance,
  and authorisation processes exceeding 12–18 months. Synthetic data —
  algorithmically generated datasets preserving the statistical properties of
  real populations without personally identifiable information (Walonoski et al.,
  2018; El Emam et al., 2020) — offer a privacy-preserving resolution. The
  European Health Data Space (EHDS; Regulation (EU) 2025/327, Art. 60) explicitly
  recognises synthetic data as a complementary instrument for health data access.

  This exploratory project tests the feasibility of a Portuguese Synthetic Health
  Data Portal by building an MVP that ingests public health data, generates
  synthetic patient records via an adapted Synthea engine, serves them through a
  FHIR-compliant API, and enables user interaction via a web dashboard. The pilot
  evaluates statistical fidelity, analytical utility, and user-perceived value
  with 15–25 users from academia, NHS planning, and health-tech. It builds on the
  PI's UOG Dashboard prototype (https://portaria-ob-gyn.web.app/) and serves as
  a decision gate for a subsequent IC&DT application.

research_questions:
  - "RQ1: Is it technically feasible to generate synthetic patient records for the Portuguese population that achieve acceptable statistical fidelity (JS divergence < 0.05) using exclusively public data sources?"
  - "RQ2: How do researchers and health-tech developers assess the analytical utility of synthetic Portuguese health data compared to international surrogate datasets?"
  - "RQ3: What are the primary barriers to adoption and what design features are critical for user engagement?"

