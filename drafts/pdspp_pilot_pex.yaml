ethical_considerations: |
  The project uses exclusively publicly available, aggregate data — no
  individual-level data is accessed or processed. Synthetic records do not
  constitute personal data under GDPR Art. 4(1). The user pilot involves
  human participants providing informed consent. Ethics approval will be
  sought from UA. All pilot data will be anonymised.

