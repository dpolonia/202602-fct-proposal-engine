methodology_notes: |
  Phase 1 — MVP Development (M1–M9):
  T1.1: ETL pipelines for 5 public sources (INE Census, DGS health profiles,
  ACSS GDH summary tables, PORDATA, INSA survey aggregates).
  T1.2: Synthea-PT minimal adaptation — demographic calibration (Census 2021),
  3 clinical modules (diabetes, hypertension, maternal care).
  T1.3: RESTful API + basic FHIR endpoint. Web dashboard building on UOG
  Dashboard architecture.

  Phase 2 — Validation & Pilot (M7–M15):
  T2.1: Statistical fidelity (JS divergence, KS tests, correlation matrices).
  T2.2: User pilot with 15–25 participants (academics, NHS planners, health-tech).
  Mixed methods: task-based usability testing, utility assessment, interviews.
  T2.3: Privacy assessment — membership inference attack simulations.

  Phase 3 — Synthesis & Roadmap (M13–M18):
  T3.1: Feasibility report with go/no-go recommendation for full-scale IC&DT.
  T3.2: Production portal design spec (architecture, governance, EHDS Art. 60).
  T3.3: IC&DT proposal preparation.

