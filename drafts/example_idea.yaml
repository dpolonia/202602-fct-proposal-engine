# --- Core Idea ---
title: "Digital Transformation and Organizational Resilience: AI-Driven Frameworks for SME Sustainability"
title_pt: "Transformação Digital e Resiliência Organizacional: Modelos Baseados em IA para a Sustentabilidade das PMEs"
acronym: "DigiResilient"
typology: "SR&TD"  # SR&TD or PEX

# --- Research Framing ---
research_topic: |
  This project investigates how small and medium enterprises (SMEs) can leverage 
  artificial intelligence and digital transformation strategies to build organizational 
  resilience in the face of economic uncertainty, supply chain disruptions, and 
  sustainability pressures. Despite growing literature on digital transformation in 
  large corporations, there is a significant gap in understanding how resource-constrained 
  SMEs adopt and benefit from AI-driven tools, and how these tools contribute to both 
  operational resilience and sustainability performance. The project proposes a mixed-methods 
  approach combining longitudinal survey data with qualitative case studies across Portuguese 
  and European SMEs, developing a novel AI-augmented resilience assessment framework.

research_questions:
  - "RQ1: How do AI adoption patterns in SMEs relate to organizational resilience outcomes?"
  - "RQ2: What institutional and resource-based factors moderate the relationship between digital transformation and SME sustainability?"
  - "RQ3: Can an AI-driven diagnostic tool reliably predict resilience vulnerabilities in SMEs?"

