ethical_considerations: |
  SynthPopPT works exclusively with publicly available, aggregate data sources —
  no individual-level clinical data is accessed or processed. The synthetic data
  generation process is designed as privacy-by-design (Cavoukian, 2011), producing
  datasets that do not constitute personal data under GDPR Art. 4(1) as recognised
  by the EDPB. Nonetheless, the project will:
  (a) submit a Data Protection Impact Assessment (DPIA) for the ETL pipelines;
  (b) obtain ethics committee approval from UA;
  (c) validate privacy guarantees through membership and attribute inference attacks;
  (d) engage with the CNPD for regulatory guidance on synthetic data status.
  No human subjects are involved in data collection.

