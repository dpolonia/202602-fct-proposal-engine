methodology_notes: |
  The project follows a design-science approach with four iterative workstreams:

  WS1 — Data Ingestion & Harmonisation (M1–M12): Automated ETL pipelines for
  10+ public data sources (INE, DGS, ACSS, PORDATA, INSA, OECD Health Statistics).
  Common data model based on OMOP CDM v5.4 with FHIR R4 export capability.

  WS2 — Synthea-PT Engine Development (M6–M24): Demographic calibration using
  Census 2021 and INE projections. Epidemiological parameterisation from DGS/INSA
  prevalence data. Care-pathway modelling aligned with NHS organisation (primary,
  hospital, continuing, palliative). Initially 5 clinical modules (diabetes, COPD,
  hypertension, maternal care, colorectal cancer), expanding to 10+ by M36.

  WS3 — Validation Framework (M12–M30): Tri-partite assessment — statistical
  fidelity (JS divergence, KS tests, correlation preservation), analytical utility
  (replication of 3+ published epidemiological studies), privacy (membership/
  attribute inference attacks per ISO 27559:2022). Iterative refinement loop.

  WS4 — API & Governance (M18–M36): RESTful API + FHIR server. FAIR metadata.
  Governance framework aligned with GDPR and EHDS Art. 60. Policy recommendations
  for the future Portuguese HDAB.

  Computational platform: GCP (Cloud Run, BigQuery), open-source stack (Synthea,
  HAPI FHIR, dbt, Apache Airflow).

