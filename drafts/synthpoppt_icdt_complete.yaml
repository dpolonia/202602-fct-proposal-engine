# --- Core Idea ---
title: "SynthPopPT: A Calibrated Synthetic Population Engine for the Portuguese National Health Service"
title_pt: "SynthPopPT: Um Motor de População Sintética Calibrado para o Serviço Nacional de Saúde Português"
acronym: "SynthPopPT"
typology: "SR&TD"

# --- Research Framing ---
research_topic: |
  Health systems generate ever-growing volumes of clinical and administrative data,
  yet secondary access for research, planning, and innovation remains severely
  constrained by data-protection regulation (GDPR, Regulation (EU) 2016/679) and
  fragmented governance structures. In Portugal, authorisation processes for
  secondary use of NHS data routinely exceed 12–18 months, a bottleneck the
  literature terms the "abundance–inaccessibility paradox" (Caulfield et al., 2019).
  Synthetic data — algorithmically generated datasets that reproduce the statistical
  properties of real data without containing personally identifiable information
  (Walonoski et al., 2018; El Emam et al., 2020) — offer a privacy-preserving
  resolution to this dilemma.

  This project develops SynthPopPT, a calibrated synthetic-population engine that
  adapts the open-source Synthea Patient Generator to Portuguese demographics,
  epidemiology, and NHS organisational structures. The engine will be parameterised
  using Census 2021 data, INE population projections, DGS health profiles, INSA
  national health surveys, and ACSS activity data, producing synthetic patient
  trajectories across primary care, hospital care, and integrated continuing care.
  A rigorous tri-partite validation framework — statistical fidelity (Jensen–Shannon
  divergence, Kolmogorov–Smirnov tests), analytical utility (replication of published
  epidemiological studies), and privacy protection (membership and attribute inference
  attacks per ISO 27559:2022) — will ensure the engine meets both scientific and
  regulatory standards.

  SynthPopPT is strategically aligned with the European Health Data Space (EHDS;
  Regulation (EU) 2025/327), whose Article 60 explicitly foresees Health Data Access
  Bodies providing synthetic data as a complement to real-data access, and whose
  implementation timeline (national HDABs by 2028) creates an opportunity for
  Portugal to position itself as a reference in synthetic health data governance.

research_questions:
  - "RQ1: How can the Synthea Patient Generator be calibrated to reproduce the demographic, epidemiological, and care-pathway structures of the Portuguese NHS with demonstrable statistical fidelity (JS divergence < 0.05)?"
  - "RQ2: To what extent do synthetic datasets generated by SynthPopPT preserve the analytical utility of real NHS data, measured by the replication of published population-health studies (utility preservation ratio > 0.85)?"
  - "RQ3: What privacy guarantees can SynthPopPT provide against membership and attribute inference attacks, and how do these compare with ISO 27559:2022 thresholds?"
  - "RQ4: What governance framework is required to deploy a national synthetic-data infrastructure that satisfies both GDPR requirements and EHDS Article 60 provisions?"

