methodology_notes: |
  Phase 1 — Regulatory Mapping & Requirements (M1–M6):
  Task 1.1: Systematic analysis of EHDS Regulation (esp. Art. 33–60) mapped
  against Portuguese legal framework (GDPR national implementation, CNPD
  competences, Law 58/2019, NHS governance structures). Deliverable:
  gap-analysis report.
  Task 1.2: Comparative study of 3 EU front-runner HDAB designs (Finland/
  Findata, France/Health Data Hub, Netherlands). Deliverable: best-practices
  synthesis with applicability assessment for Portugal.
  Task 1.3: Stakeholder consultation workshop (ARTE/SPMS, ACSS, CNPD,
  DGS, academic researchers, health-tech). Deliverable: requirements document.

  Phase 2 — Sandbox Development & Testing (M5–M14):
  Task 2.1: Deploy synthetic-data sandbox environment on GCP (Synthea-PT
  engine, HAPI FHIR server, OMOP CDM mapping, access-request workflow
  simulation).
  Task 2.2: Implement and test 4 EHDS secondary-use workflows:
  (a) data-access permit request and processing;
  (b) data minimisation and pseudonymisation pipeline;
  (c) secure processing environment simulation;
  (d) cross-border data exchange scenario (mock HealthData@EU node).
  Task 2.3: Pilot with 10–15 institutional users simulating real access
  requests. Mixed-methods evaluation (workflow logs, interviews).

  Phase 3 — Governance Blueprint & Policy Recommendations (M12–M18):
  Task 3.1: Draft governance model for Portuguese HDAB synthetic-data
  service (roles, decision rights, QA, pricing, interoperability standards).
  Task 3.2: Policy brief for ARTE/SPMS and Ministry of Health on EHDS
  readiness, including synthetic data as Article 60 first-tier service.
  Task 3.3: Technical specification for production-grade sandbox scalable
  to national HDAB infrastructure.

