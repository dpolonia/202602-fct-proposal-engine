# --- Core Idea ---
title: "Preparing Portugal for the European Health Data Space: A Synthetic Data Sandbox for Secondary-Use Governance"
title_pt: "Preparar Portugal para o Espaço Europeu de Dados de Saúde: Uma Sandbox de Dados Sintéticos para a Governança do Uso Secundário"
acronym: "EHDS-SandboxPT"
typology: "PEX"

# --- Research Framing ---
research_topic: |
  The European Health Data Space Regulation (EHDS; Regulation (EU) 2025/327)
  requires each Member State to designate or establish a national Health Data
  Access Body (HDAB) by 2028, capable of managing secondary-use permits, data
  linkage, secure processing environments, and — as explicitly foreseen in
  Article 60 — synthetic data provision. Portugal has yet to designate its HDAB,
  and the institutional, technical, and regulatory groundwork for EHDS
  implementation remains largely uncharted. This gap creates a dual risk:
  non-compliance with EU obligations and loss of competitive positioning in
  the European health-data ecosystem.

  This exploratory project addresses this gap by developing a synthetic-data
  sandbox — a controlled technical environment using algorithmically generated
  Portuguese health data — that simulates the core secondary-use workflows of
  a future Portuguese HDAB. The sandbox enables the testing of data-access
  request processing, data-minimisation protocols, de-identification pipelines,
  FHIR-based interoperability, and cross-border data exchange scenarios, all
  without exposing real patient data. By piloting these workflows with
  institutional stakeholders (ARTE/SPMS, ACSS, CNPD, academic researchers),
  the project generates actionable governance insights and a technical
  blueprint for Portugal's EHDS compliance strategy.

  The project leverages synthetic patient records generated through a
  Portuguese-calibrated Synthea engine and served through standards-compliant
  interfaces (HL7 FHIR R4, OMOP CDM), building on the PI's prior work on
  the UOG Dashboard prototype (https://portaria-ob-gyn.web.app/) and ongoing
  research on health data governance in Beveridgean systems.

research_questions:
  - "RQ1: What institutional, legal, and technical requirements must Portugal's future HDAB meet to implement EHDS Article 60 synthetic-data provisions, and how do these interact with existing GDPR and CNPD frameworks?"
  - "RQ2: Can a synthetic-data sandbox reliably simulate the core secondary-use workflows (access requests, data minimisation, secure processing, cross-border exchange) required by the EHDS Regulation?"
  - "RQ3: What governance model — including roles, decision rights, quality assurance, and interoperability standards — is most appropriate for a Portuguese HDAB that incorporates synthetic data as a first-tier service?"

