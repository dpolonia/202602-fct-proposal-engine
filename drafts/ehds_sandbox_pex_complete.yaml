ethical_considerations: |
  The project operates exclusively with synthetic data and does not access
  real patient records at any stage. The sandbox environment is designed as
  a simulation layer — all "access requests" and "data exchanges" involve
  synthetic patient records generated by Synthea-PT.

  The stakeholder workshop and user pilot involve human participants
  providing professional opinions, not personal health data. Informed
  consent will be obtained for all participants. Ethics approval will
  be sought from UA for the consultation and pilot activities.

  The project's outputs (governance blueprint, policy brief) will
  themselves contribute to strengthening privacy governance in Portugal's
  health data ecosystem.

