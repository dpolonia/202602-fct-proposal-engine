ethical_considerations: |
  The project uses exclusively publicly available, aggregate data — no
  individual-level data is accessed or processed. Synthetic data generated by
  Synthea-PT do not constitute personal data under GDPR Art. 4(1). The user
  pilot involves human participants (researchers, developers) who will provide
  informed consent. Ethics approval will be sought from UA for the pilot study.
  All pilot data (interview transcripts, usability logs) will be anonymised.

