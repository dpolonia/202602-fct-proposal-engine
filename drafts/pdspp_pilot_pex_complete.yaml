# --- Core Idea ---
title: "Feasibility and Utility of a Portuguese Synthetic Health Data Portal: An Exploratory Pilot"
title_pt: "Viabilidade e Utilidade de um Portal de Dados de Saúde Sintéticos Português: Um Piloto Exploratório"
acronym: "PDSPP-Pilot"
typology: "PEX"

# --- Research Framing ---
research_topic: |
  The secondary use of health data for research, innovation, and system planning
  is severely constrained in Portugal by data-protection requirements,
  fragmented governance, and authorisation processes that routinely exceed
  12–18 months. Synthetic data — algorithmically generated datasets that
  preserve the statistical properties of real populations without containing
  personally identifiable information (Walonoski et al., 2018; El Emam et al.,
  2020) — offer a promising resolution. The European Health Data Space (EHDS;
  Regulation (EU) 2025/327, Art. 60) explicitly recognises synthetic data as a
  complementary instrument for health data access, creating a policy window
  for early-mover countries.

  This exploratory project conducts a rapid feasibility test of a Portuguese
  Synthetic Health Data Portal by developing a minimal viable product (MVP)
  that demonstrates end-to-end capability: ingesting public health data,
  generating synthetic patient records via an adapted Synthea engine, serving
  them through a FHIR-compliant API, and enabling user interaction via a
  web-based dashboard. The pilot targets two concrete use cases — (1) academic
  research in population health and (2) health-tech product testing — and
  evaluates the MVP's statistical fidelity, analytical utility, and
  user-perceived value through a structured pilot with 15–25 users from
  academia, NHS planning, and the health-tech ecosystem.

  The project builds on a functional proof-of-concept (the UOG Dashboard,
  https://portaria-ob-gyn.web.app/) and is designed as a decision gate:
  its results will determine whether a full-scale portal development is
  warranted and will generate the evidence base for a subsequent IC&DT
  application.

research_questions:
  - "RQ1: Is it technically feasible to generate synthetic patient records for the Portuguese population that achieve acceptable statistical fidelity (JS divergence < 0.05) using exclusively public data sources?"
  - "RQ2: How do researchers and health-tech developers assess the analytical utility and practical value of synthetic Portuguese health data compared to international surrogate datasets?"
  - "RQ3: What are the primary barriers to adoption of synthetic health data in the Portuguese research and innovation ecosystem, and what design features are critical for user engagement?"

