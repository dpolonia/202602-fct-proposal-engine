methodology_notes: |
  Phase 1 — MVP Development (M1–M9):
  Task 1.1: ETL pipelines for 5 priority public sources (INE Census, DGS health
  profiles, ACSS GDH summary tables, PORDATA, INSA survey aggregates).
  Task 1.2: Synthea-PT minimal adaptation — demographic calibration (Census 2021)
  and 3 clinical modules (diabetes, hypertension, maternal care).
  Task 1.3: RESTful API + basic FHIR endpoint. Web dashboard for data exploration
  and custom dataset generation. Building on UOG Dashboard architecture.

  Phase 2 — Validation & Pilot (M7–M15):
  Task 2.1: Statistical fidelity assessment (JS divergence, KS tests, correlation
  matrices) against published aggregate NHS statistics.
  Task 2.2: User pilot with 15–25 participants across 3 user segments (academic
  researchers, NHS planners, health-tech developers). Mixed-methods evaluation:
  task-based usability testing, utility assessment (can users replicate a
  published finding?), and semi-structured interviews.
  Task 2.3: Privacy assessment — membership inference attack simulations.

  Phase 3 — Synthesis & Roadmap (M13–M18):
  Task 3.1: Synthesis report with feasibility metrics, user feedback analysis,
  and go/no-go recommendation for full-scale development.
  Task 3.2: Design specification for a production portal (architecture,
  governance model, sustainability pathway, EHDS integration points).
  Task 3.3: Preparation of IC&DT proposal for full-scale development.

