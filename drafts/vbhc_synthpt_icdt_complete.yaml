methodology_notes: |
  Phase 1 — VBHC Framework Adaptation (M1–M10): Systematic literature review
  on VBHC implementation in Beveridgean systems. Adaptation of the Porter–Teisberg
  framework to Portuguese NHS institutional structures (ULS, ACES, SNS financing).
  Definition of care cycles, outcome metrics, and cost categories for 3 tracer
  conditions: DM2, COPD, hip/knee replacement. Expert panel validation (Delphi, 2
  rounds).

  Phase 2 — Synthetic Data Generation & Costing (M8–M22): Parameterisation of
  Synthea-PT modules for the 3 tracer conditions using DGS prevalence data, INSA
  health surveys, and ACSS GDH tables. Integration of cost modules using published
  GDH prices and NHS unit costs. Generation of synthetic cohorts (n=50,000 per
  condition) with full clinical trajectories and cost profiles.

  Phase 3 — Validation & Benchmarking (M18–M30): Tri-partite validation of
  synthetic cost–outcome data (fidelity, utility, privacy). Benchmarking exercise
  with 3–5 ULS using aggregate real-world data for external validity. Sensitivity
  analysis of value metrics to calibration parameter uncertainty (Monte Carlo
  simulation).

  Phase 4 — Decision-Support Pilot (M24–M36): Development of interactive
  dashboards for ULS administrators showing synthetic VBHC metrics (cost per
  QALY by condition, provider variation, scenario modelling). Pilot deployment
  in 2 ULS with evaluation of decision-making impact. Policy recommendations
  for NHS-wide adoption.

