ethical_considerations: |
  The project uses exclusively synthetic data and aggregate public statistics
  for its core analyses — no individual-level patient data is accessed. The
  synthetic data generation engine (Synthea-PT) operates on public parameters
  and produces non-personal data under GDPR Art. 4(1).

  The ULS benchmarking exercise (Phase 3) will use aggregate, anonymised
  hospital-level data already published through the NHS Transparency Portal.
  The pilot deployment (Phase 4) will operate entirely on synthetic data.

  Ethical approval will be sought from UA's ethics committee for the expert
  panel (Delphi) and the ULS pilot evaluation. A DPIA will be conducted for
  the dashboards handling aggregate ULS data.

