# --- Core Idea ---
title: "Value-Based Healthcare Modelling in Beveridgean Systems Through Calibrated Synthetic Population Data"
title_pt: "Modelação de Cuidados de Saúde Baseados em Valor em Sistemas Beveridgeanos Através de Dados de População Sintética Calibrados"
acronym: "VBHC-SynthPT"
typology: "SR&TD"

# --- Research Framing ---
research_topic: |
  The transition from volume-based to value-based healthcare (VBHC) — paying for
  outcomes that matter to patients rather than for services delivered — is widely
  recognised as essential for the financial sustainability of universal health
  systems (Porter & Teisberg, 2006). Yet the implementation of VBHC in
  Beveridgean-type national health services, including the Portuguese NHS, has been
  hampered by a fundamental data paradox: the cost–outcome metrics required to
  define care cycles, measure value, and benchmark providers depend on
  patient-level longitudinal data that are either inaccessible, fragmented across
  information silos, or subject to years-long access authorisation processes under
  GDPR and national data-protection legislation.

  This project proposes a novel methodological approach: using calibrated synthetic
  population data — algorithmically generated datasets that faithfully reproduce
  the statistical properties of real populations without containing personally
  identifiable information (Walonoski et al., 2018; El Emam et al., 2020) — to
  model VBHC care cycles, cost structures, and outcome metrics for the Portuguese
  NHS. Building on the Synthea Patient Generator adapted to Portuguese demographics
  and epidemiology, the project will develop, validate, and pilot-test a VBHC
  simulation framework for three tracer conditions (diabetes mellitus type 2,
  chronic obstructive pulmonary disease, and hip/knee replacement), generating
  synthetic cost and outcome trajectories that enable value measurement,
  provider benchmarking, and prospective resource-allocation modelling.

  The project is strategically positioned at the convergence of three policy
  imperatives: the European Health Data Space (EHDS; Regulation (EU) 2025/327),
  which mandates infrastructure for secondary use of health data; the Portuguese
  NHS reform agenda, which increasingly emphasises outcome-based accountability
  in the Local Health Units (ULS); and the 2030 Agenda, which calls for
  efficient, equitable, and evidence-informed health systems (SDG 3.8).

research_questions:
  - "RQ1: To what extent can synthetic population data, calibrated to Portuguese NHS parameters, generate VBHC care-cycle cost and outcome profiles that are analytically equivalent to real-world evidence (utility preservation ratio > 0.85)?"
  - "RQ2: What is the minimum set of calibration parameters required for a synthetic VBHC model to produce reliable provider-level benchmarking, and how sensitive are value metrics to parameter uncertainty?"
  - "RQ3: How can synthetic VBHC models inform prospective resource-allocation decisions in the Portuguese NHS ULS structure, and what governance arrangements are needed to embed these tools in planning cycles?"
  - "RQ4: What adaptations to the Porter–Teisberg VBHC framework are necessary for Beveridgean health systems where provider competition is limited and funding is predominantly public?"

