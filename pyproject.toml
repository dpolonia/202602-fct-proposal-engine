[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fct-proposal-engine"
version = "0.3.0"
description = "AI-powered proposal generator and multi-model peer reviewer for FCT PTDC 2025"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    # --- LLM Clients ---
    "anthropic==0.75.0",
    "openai==2.14.0",
    "google-genai==1.56.0",
    "huggingface-hub==1.0.1",
    # --- API Framework ---
    "fastapi==0.124.0",
    "uvicorn[standard]==0.38.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.6.1",
    # --- Document Generation ---
    "python-docx==1.2.0",
    "jinja2==3.1.6",
    # --- Research & Data ---
    "httpx==0.28.1",
    # --- Utilities ---
    "pyyaml==6.0.2",
    "click==8.2.1",
    "rich==13.9.4",
    "tenacity==9.0.0",
    "tiktoken==0.12.0",
    # --- GCP ---
    "google-cloud-storage==2.19.0",
    "google-cloud-firestore==2.23.0",
    # --- Async ---
    "asyncio-pool==0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "ruff==0.15.4",
    "mypy==1.16.0",
    "pre-commit==4.5.1",
    "pip-audit==2.10.0",
]

[project.scripts]
fct-engine = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
