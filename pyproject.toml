[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fct-proposal-engine"
version = "0.1.0"
description = "AI-powered proposal generator and multi-model peer reviewer for FCT PTDC 2025"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    # --- LLM Clients ---
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-genai>=1.0.0",
    "huggingface-hub>=0.25.0",
    # --- API Framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # --- Document Generation ---
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "jinja2>=3.1.0",
    # --- Research & Data ---
    "httpx>=0.27.0",
    "pybliometrics>=3.6.0",
    "scholarly>=1.7.0",
    # --- Utilities ---
    "pyyaml>=6.0",
    "click>=8.1.0",
    "rich>=13.9.0",
    "tenacity>=9.0.0",
    "tiktoken>=0.8.0",
    # --- GCP ---
    "google-cloud-storage>=2.18.0",
    "google-cloud-firestore>=2.19.0",
    # --- Async ---
    "asyncio-pool>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
fct-engine = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
